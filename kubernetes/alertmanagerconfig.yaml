
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: kubedeploy-email-alerts
  namespace: monitoring
  labels:
    alertmanagerConfig: kubedeploy
spec:
  route:
    receiver: email
    groupBy:
      - alertname
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 1h

  receivers:
    - name: email
      emailConfigs:
        - to: toluamos19@gmail.com
          from: rozayboi82@gmail.com
          smarthost: smtp.gmail.com:587
          authUsername: toluamos19@gmail.com
          authPassword:
            name: alertmanager-email-secret
            key: password
          requireTLS: true
          sendResolved: true
