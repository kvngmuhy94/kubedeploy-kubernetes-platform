name: Deploy KubeDeploy

on:
  workflow_run:
    workflows: ["Publish KubeDeploy Image"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy latest image
        run: |
          kubectl set image deployment/kubedeploy \
            kubedeploy=ghcr.io/kvngmuhy94/kubedeploy-kubernetes-platform:latest

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/kubedeploy --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deployment kubedeploy
          kubectl get pods -l app=kubedeploy
