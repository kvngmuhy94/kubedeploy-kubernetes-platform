name: Deploy KubeDeploy

on:
  workflow_run:
    workflows: ["Publish KubeDeploy Image"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy latest image
        run: |
          kubectl set image deployment/kubedeploy \
            kubedeploy=ghcr.io/kvngmuhy94/kubedeploy-kubernetes-platform:latest

      - name: Wait for rollout
        id: rollout
        continue-on-error: true
        run: |
          kubectl rollout status deployment/kubedeploy --timeout=180s

      - name: Roll back failed deployment
        if: steps.rollout.outcome == 'failure'
        run: |
          echo "Deployment failed. Rolling back..."
          kubectl rollout undo deployment/kubedeploy
          kubectl rollout status deployment/kubedeploy --timeout=180s

      - name: Application health check
        if: steps.rollout.outcome == 'success'
        run: |
          kubectl port-forward svc/kubedeploy-service 8080:80 >/tmp/kubedeploy-portforward.log 2>&1 &
          PF_PID=$!

          sleep 5

          curl --fail --silent --show-error \
            http://127.0.0.1:8080/health

          kill $PF_PID

      - name: Verify deployment
        if: steps.rollout.outcome == 'success'
        run: |
          kubectl get deployment kubedeploy
          kubectl get pods -l app=kubedeploy

      - name: Fail workflow if deployment failed
        if: steps.rollout.outcome == 'failure'
        run: |
          echo "Deployment failed and was rolled back."
          exit 1
