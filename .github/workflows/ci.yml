name: KubeDeploy CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Validate FastAPI application
        run: |
          python -m py_compile app/main.py

      - name: Build Docker image
        run: |
          docker build -t kubedeploy:ci .

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f kubernetes/configmap.yaml
          kubectl apply --dry-run=client -f kubernetes/deployment.yaml
          kubectl apply --dry-run=client -f kubernetes/service.yaml
          kubectl apply --dry-run=client -f kubernetes/hpa.yaml
          kubectl apply --dry-run=client -f kubernetes/secret.example.yaml
